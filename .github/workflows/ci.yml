name: Quality

on:
  push:
  pull_request:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  statuses: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.client_payload.git.sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment commit
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/checkout@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        if: ${{ github.event_name != 'repository_dispatch' }}
        uses: actions/checkout@v4
      - name: Notify Vercel
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: "Vercel - sm-portfolio: lint"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests and coverage (80% minimum)
        run: pnpm test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Production build
        run: pnpm build
